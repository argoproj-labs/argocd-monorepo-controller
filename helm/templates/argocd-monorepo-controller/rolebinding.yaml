apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "argocd-monorepo-controller.controller.fullname" . }}
  namespace: {{ include  "argocd-monorepo-controller.namespace" . }}
  labels:
    {{- include "argocd-monorepo-controller.labels" (dict "context" . "component" .Values.controller.name "name" .Values.controller.name) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "argocd-monorepo-controller.controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "argocd-monorepo-controller.controller.serviceAccountName" . }}
    namespace: {{ include "argocd-monorepo-controller.namespace" . }}
