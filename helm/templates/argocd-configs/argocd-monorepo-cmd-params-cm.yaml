{{- if .Values.configs.params.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-monorepo-cmd-params-cm
  namespace: {{ include  "argocd-monorepo-controller.namespace" . }}
  labels:
    {{- include "argocd-monorepo-controller.labels" (dict "context" . "component" .Values.server.name "name" "monorepo-cmd-params-cm") | nindent 4 }}
  {{- if .Values.configs.params.annotations }}
  annotations:
  {{- range $key, $value := .Values.configs.params.annotations }}
    {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
data:
  {{- include "argocd-monorepo-controller.config.params" . | trim | nindent 2 }}
{{- end }}
